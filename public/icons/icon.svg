<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2A1F4D"/>
      <stop offset="1" stop-color="#140E26"/>
    </linearGradient>
    <linearGradient id="safe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="bold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="insane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#05020D" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- Soft light behind each card, in its level's colour. -->
    <circle cx="130" cy="300" r="110" fill="#14B8A6" opacity="0.45" filter="url(#glow)"/>
    <circle cx="256" cy="210" r="110" fill="#F97316" opacity="0.4" filter="url(#glow)"/>
    <circle cx="382" cy="300" r="110" fill="#8B5CF6" opacity="0.5" filter="url(#glow)"/>

    <!-- Three cards fanned from a point below: Safe, Insane, then Bold on top. -->
    <g transform="translate(256 470) rotate(-28)" filter="url(#cardShadow)">
      <rect x="-82" y="-330" width="164" height="226" rx="24" fill="url(#safe)"/>
      <rect x="-82" y="-330" width="164" height="226" rx="24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9"/>
      <g transform="translate(-70 -312) scale(2.5)" fill="#FFFFFF">
        <path d="M12 1.8 20.5 5v6.4c0 5.3-3.6 9.6-8.5 11-4.9-1.4-8.5-5.7-8.5-11V5L12 1.8Z"/>
        <path d="m8 12 2.8 2.8L16.4 9" fill="none" stroke="#0F766E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <g transform="translate(256 470) rotate(28)" filter="url(#cardShadow)">
      <rect x="-82" y="-330" width="164" height="226" rx="24" fill="url(#insane)"/>
      <rect x="-82" y="-330" width="164" height="226" rx="24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9"/>
      <g transform="translate(10 -312) scale(2.5)" fill="#FFFFFF">
        <path d="M13.8 1.5 3.6 13.6h6.9l-1.6 8.9 10.5-12.6h-7l1.4-8.4Z"/>
      </g>
    </g>
    <g transform="translate(256 470)" filter="url(#cardShadow)">
      <rect x="-82" y="-350" width="164" height="226" rx="24" fill="url(#bold)"/>
      <rect x="-82" y="-350" width="164" height="226" rx="24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.9"/>
      <g transform="translate(-40 -278) scale(3.33)" fill="#FFFFFF">
        <path d="M12.6 1.6c.5 2.9 2.4 4.6 4.1 6.5 1.6 1.8 2.8 3.8 2.8 6.4A7.5 7.5 0 0 1 12 22a7.5 7.5 0 0 1-7.5-7.5c0-2.7 1.2-4.7 2.7-6.3.1 1.9 1 3.4 2.5 4.1-.4-4.1.9-7.8 2.9-10.7Z"/>
      </g>
    </g>
  </g>
</svg>
