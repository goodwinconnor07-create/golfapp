<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2F7BE0"/>
      <stop offset="0.6" stop-color="#5FA8F2"/>
      <stop offset="1" stop-color="#A9D6FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#FFF6C8" stop-opacity="0.8"/>
      <stop offset="0.35" stop-color="#FFE38A" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFE38A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FA35A"/>
      <stop offset="1" stop-color="#0F5A2E"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F7F8FB"/>
      <stop offset="1" stop-color="#E3E7EF"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D6A"/>
      <stop offset="1" stop-color="#C8102E"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5DD36A"/>
      <stop offset="1" stop-color="#1F8A3B"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D8696"/>
      <stop offset="0.5" stop-color="#E8ECF2"/>
      <stop offset="1" stop-color="#8D95A6"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-8" dy="18" stdDeviation="12" flood-color="#0B2A5C" flood-opacity="0.4"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0B2A5C" flood-opacity="0.3"/>
    </filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- Sky light where the card is heading. -->
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- Sun in the top corner. -->
    <circle cx="452" cy="58" r="44" fill="#FFE27A"/>
    <circle cx="452" cy="58" r="34" fill="#FFF3B8"/>
    <!-- Clouds. -->
    <g fill="#FFFFFF">
      <g opacity="0.95"><ellipse cx="96" cy="112" rx="56" ry="22"/><circle cx="78" cy="100" r="24"/><circle cx="112" cy="92" r="30"/></g>
      <g opacity="0.8"><ellipse cx="262" cy="392" rx="46" ry="16"/><circle cx="250" cy="382" r="18"/><circle cx="276" cy="376" r="22"/></g>
      <g opacity="0.7"><ellipse cx="470" cy="372" rx="52" ry="18"/><circle cx="458" cy="360" r="22"/></g>
    </g>

    <!-- The fairway at the bottom, curving away. -->
    <path d="M-20 452 C 120 410, 300 404, 540 436 L 540 540 L -20 540 Z" fill="url(#turf)"/>
    <path d="M-20 452 C 120 410, 300 404, 540 436" fill="none" stroke="#6EE08F" stroke-width="3" opacity="0.5"/>
    <g stroke="#0B4723" stroke-width="2" opacity="0.35" stroke-linecap="round">
      <path d="M40 486 L 30 512"/><path d="M130 470 L 124 500"/><path d="M230 466 L 228 498"/><path d="M330 468 L 334 500"/><path d="M430 476 L 440 506"/>
    </g>

    <!-- The tee it was launched from. -->
    <g filter="url(#soft)">
      <path d="M96 432 L 122 432 L 114 444 L 112 470 Q 109 476 106 470 L 104 444 Z" fill="#FFFFFF"/>
      <ellipse cx="109" cy="432" rx="15" ry="5" fill="#E3E7EF"/>
    </g>
    <!-- Dust kicked up off the tee. -->
    <g fill="#FFFFFF" opacity="0.55">
      <circle cx="84" cy="418" r="4"/><circle cx="134" cy="414" r="3"/><circle cx="96" cy="404" r="2.5"/><circle cx="124" cy="398" r="2"/>
    </g>

    <!-- Flight path: a rising arc from the tee to the card. -->
    <path d="M110 420 C 170 300, 250 220, 330 176" fill="none" stroke="url(#trail)" stroke-width="16" stroke-linecap="round" filter="url(#blur2)"/>
    <path d="M110 420 C 170 300, 250 220, 330 176" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.7"/>

    <!-- Speed lines behind the card. -->
    <g stroke="#FFFFFF" stroke-linecap="round" transform="translate(-34 34)">
      <path d="M262 262 L 310 222" stroke-width="7" opacity="0.8"/>
      <path d="M286 292 L 340 248" stroke-width="5" opacity="0.6"/>
      <path d="M236 238 L 274 206" stroke-width="4" opacity="0.5"/>
    </g>

    <!-- The card, high in the air and spinning. -->
    <g transform="translate(360 166) rotate(24) scale(1.28)" filter="url(#cardShadow)">
      <rect x="-62" y="-86" width="124" height="172" rx="16" fill="url(#card)"/>
      <rect x="-62" y="-86" width="124" height="172" rx="16" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="-52" y="-76" width="104" height="152" rx="10" fill="none" stroke="#1E3A6E" stroke-width="2.5" opacity="0.3"/>
      <!-- Middle: a flag on a green. -->
      <ellipse cx="0" cy="44" rx="42" ry="14" fill="url(#hill)"/>
      <ellipse cx="0" cy="40" rx="9" ry="3.5" fill="#0B1A10"/>
      <rect x="-2.5" y="-40" width="5" height="82" rx="2.5" fill="url(#pole)"/>
      <path d="M2.5 -40 C 18 -36, 26 -42, 40 -32 C 28 -24, 18 -26, 2.5 -14 Z" fill="url(#flag)"/>
      <circle cx="0" cy="-41" r="4" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="1"/>
      <!-- Corner pips. -->
      <g fill="#C8102E">
        <path d="M-44 -66 h4 v20 h-4 Z"/>
        <path d="M-40 -66 l 14 5 l -14 5 Z"/>
        <g transform="rotate(180)">
          <path d="M-44 -66 h4 v20 h-4 Z"/>
          <path d="M-40 -66 l 14 5 l -14 5 Z"/>
        </g>
      </g>
      <!-- A shine across the face. -->
      <path d="M-62 -40 L 10 -86 L 40 -86 L -62 -12 Z" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <!-- Sparkles around the card. -->
    <g fill="#FFFFFF">
      <path d="M190 150 l 4 12 l 12 4 l -12 4 l -4 12 l -4 -12 l -12 -4 l 12 -4 Z" opacity="0.9"/>
      <path d="M262 98 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z" opacity="0.7"/>
      
    </g>
  </g>
</svg>
